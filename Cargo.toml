[package]
name = "sudo-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MCP server that runs sudo commands via a native OS password dialog"
repository = "https://github.com/0xMH/sudo-mcp"

[[bin]]
name = "sudo-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
